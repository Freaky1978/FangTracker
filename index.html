<!doctype html><html lang='de'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#0d5c7d'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='default'><meta name='apple-mobile-web-app-title' content='FangTracker'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon.svg'><link rel='stylesheet' href='style.css'><title>FangTracker</title></head><body><header><div class='brand'>🐟 <b>FangTracker</b></div><div class='tag'>Dein persönliches Fangbuch</div></header><main>
<section id='home' class='page active'><h1>Meine Fänge</h1><button class='primary' onclick="show('add')">＋ Fang hinzufügen</button><div id='summary' class='stats'></div><h2>Letzte Fänge</h2><div id='recent'></div></section>
<section id='add' class='page'><h1>Neuer Fang</h1><form id='form'><label>Foto</label><div class='photo-actions'><button type='button' class='secondary' onclick="openCamera()">📷 Foto aufnehmen</button><button type='button' class='secondary' onclick="openLibrary()">🖼️ Foto auswählen</button></div><input id='cameraInput' class='hidden' type='file' accept='image/*' capture='environment'><input id='libraryInput' class='hidden' type='file' accept='image/*'><div id='photoStatus' class='muted'>Kein Foto ausgewählt</div><img id='preview' class='preview hidden'><div class='grid'><label>Fischart<input id='species' required placeholder='z. B. Hecht'></label><label>Gewässer<input id='water' placeholder='z. B. Weser'></label><label>Länge (cm)<input id='length' type='number' step='0.1'></label><label>Gewicht (kg)<input id='weight' type='number' step='0.01'></label><label>Köder<input id='bait' placeholder='z. B. Gummifisch'></label><label>Angelmethode<input id='method' placeholder='z. B. Spinnfischen'></label></div><label>Notizen<textarea id='notes' rows='3'></textarea></label><div class='location'><button type='button' class='secondary' onclick='getLocation()'>📍 Aktuelle Position übernehmen</button><span id='locText'>Keine Position gespeichert</span></div><button class='primary' type='submit'>Fang speichern</button></form></section>
<section id='log' class='page'><h1>Fangbuch</h1><input id='search' placeholder='Fischart, Gewässer oder Köder suchen …'><div id='list'></div></section><section id='stats' class='page'><h1>Statistik</h1><div id='statsBody'></div></section><section id='map' class='page'><h1>Fangplätze</h1><p>Gespeicherte GPS-Positionen deiner Fänge:</p><div id='mapList'></div></section>
</main><nav><button onclick="show('home')">⌂<span>Start</span></button><button onclick="show('log')">▤<span>Fangbuch</span></button><button class='plus' onclick="show('add')">＋</button><button onclick="show('stats')">▥<span>Statistik</span></button><button onclick="show('map')">⌖<span>Karte</span></button></nav><script src='app.js?v=1.1'></script></body></html>
